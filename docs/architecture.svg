<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif">
  <title>PHOENIX Skill orchestration (matches SKILL.md steps 1-6)</title>
  <rect x="4" y="4" width="752" height="412" rx="10" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold">PHOENIX Recovery Intelligence — orchestration</text>
  <!-- user -->
  <rect x="30" y="50" width="200" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="130" y="72" text-anchor="middle" font-size="12" font-weight="bold">User input (step 1)</text>
  <text x="130" y="88" text-anchor="middle" font-size="11">project + failure scenario</text>
  <text x="130" y="102" text-anchor="middle" font-size="11">authorized NAS scope only</text>
  <!-- scope boundary -->
  <rect x="30" y="140" width="700" height="250" rx="8" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="44" y="158" font-size="11" fill="#555">user-authorized scope · read-only · no broadening</text>
  <!-- file discovery -->
  <rect x="50" y="170" width="200" height="80" rx="8" fill="#e8f4e8" stroke="#333" stroke-width="1.5"/>
  <text x="150" y="192" text-anchor="middle" font-size="12" font-weight="bold">file-agent (step 2)</text>
  <text x="150" y="208" text-anchor="middle" font-size="11">ug-filesystem</text>
  <text x="150" y="222" text-anchor="middle" font-size="11">find · ls · stat · sha256sum</text>
  <text x="150" y="236" text-anchor="middle" font-size="11">verified paths + coverage</text>
  <!-- document -->
  <rect x="280" y="170" width="200" height="80" rx="8" fill="#e8ecf8" stroke="#333" stroke-width="1.5"/>
  <text x="380" y="192" text-anchor="middle" font-size="12" font-weight="bold">document-agent (step 3)</text>
  <text x="380" y="208" text-anchor="middle" font-size="11">ug-document</text>
  <text x="380" y="222" text-anchor="middle" font-size="11">qa · extract · reconcile</text>
  <text x="380" y="236" text-anchor="middle" font-size="11">prerequisites + conflicts</text>
  <!-- verify -->
  <rect x="510" y="170" width="200" height="80" rx="8" fill="#e8f4e8" stroke="#333" stroke-width="1.5"/>
  <text x="610" y="192" text-anchor="middle" font-size="12" font-weight="bold">file-agent (step 4)</text>
  <text x="610" y="208" text-anchor="middle" font-size="11">targeted verification</text>
  <text x="610" y="222" text-anchor="middle" font-size="11">PRESENT / ABSENT /</text>
  <text x="610" y="236" text-anchor="middle" font-size="11">INACCESSIBLE / UNRESOLVED</text>
  <!-- arrows row 1 -->
  <line x1="250" y1="210" x2="278" y2="210" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="210" x2="508" y2="210" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="264" y="202" font-size="9" fill="#555">completed</text>
  <text x="494" y="202" font-size="9" fill="#555">completed</text>
  <!-- knowledge -->
  <rect x="280" y="280" width="200" height="80" rx="8" fill="#f8f0e0" stroke="#333" stroke-width="1.5"/>
  <text x="380" y="302" text-anchor="middle" font-size="12" font-weight="bold">knowledge-agent (step 5)</text>
  <text x="380" y="318" text-anchor="middle" font-size="11">ug-knowledge collect-evidence</text>
  <text x="380" y="332" text-anchor="middle" font-size="11">labels + verdict + next steps</text>
  <text x="380" y="346" text-anchor="middle" font-size="11">save-text* = approval-gated</text>
  <line x1="610" y1="250" x2="610" y2="262" stroke="#333" stroke-width="2"/>
  <line x1="610" y1="262" x2="380" y2="262" stroke="#333" stroke-width="2"/>
  <line x1="380" y1="262" x2="380" y2="278" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <!-- report -->
  <rect x="510" y="280" width="200" height="80" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="610" y="302" text-anchor="middle" font-size="12" font-weight="bold">Report (step 6)</text>
  <text x="610" y="318" text-anchor="middle" font-size="11">8 sections · citations</text>
  <text x="610" y="332" text-anchor="middle" font-size="11">BLOCKER / CLEAR /</text>
  <text x="610" y="346" text-anchor="middle" font-size="11">INSUFFICIENT EVIDENCE</text>
  <line x1="480" y1="320" x2="508" y2="320" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="610" y1="360" x2="610" y2="372" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="610" y1="372" x2="150" y2="372" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="150" y1="372" x2="150" y2="122" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="380" y="384" text-anchor="middle" font-size="10" fill="#555">Recovery Closure: user fixes + prior report → steps 2–5 re-run on fresh evidence → §9 Recovery Delta</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
